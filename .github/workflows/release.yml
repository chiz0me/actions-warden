name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Verify tag matches package.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Verify deps pinned
        run: node scripts/verify-deps.js

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --generate-notes \
            --verify-tag

  floating-major-tag:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update floating major tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Extract MAJOR from vMAJOR.MINOR.PATCH (rejects suffixes).
          if [[ ! "$REF_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::skipping floating tag for non-release tag $REF_NAME"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          target_sha="$(git rev-list -n1 "$REF_NAME")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-move the floating tag locally and push it.
          git tag --force "$major" "$target_sha"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            push --force "https://github.com/${REPO}.git" "refs/tags/${major}"

          echo "moved $major -> $target_sha (from $REF_NAME)"

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Check if version already on registry
        id: check
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "::notice::${pkg_name}@${pkg_version} is already published; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
