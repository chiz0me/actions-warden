name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: actions-warden-release
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Verify stable tag, package version, and main ancestry
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must be stable vX.Y.Z versions: $REF_NAME"
            exit 1
          fi
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${REF_NAME#v}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT_SHA" refs/remotes/origin/main; then
            echo "::error::tag commit $COMMIT_SHA is not contained in origin/main"
            exit 1
          fi

      - name: Verify npm release state and retry integrity
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-release-version.js --tag "$REF_NAME" --allow-existing

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate YAML
        run: npm run check:yaml

      - name: Validate documentation coverage
        run: npm run check:docs

      - name: Verify deps pinned
        run: node scripts/verify-deps.js

      - name: Verify all version sources
        run: node scripts/verify-version-sync.js

      - name: Verify npm package contents
        run: npm run check:package

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify bundled GitHub Action
        run: npm run check:action-bundle

  release-draft:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $REF_NAME already exists; reusing it"
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --generate-notes \
              --verify-tag \
              --draft
          fi

  release:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release edit "$REF_NAME" --draft=false

  floating-major-tag:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update floating major tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Extract MAJOR from vMAJOR.MINOR.PATCH (rejects suffixes).
          if [[ ! "$REF_NAME" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::skipping floating tag for non-release tag $REF_NAME"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          target_sha="$(git rev-list -n1 "$REF_NAME")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-move the floating tag locally and push it.
          git tag --force "$major" "$target_sha"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            push --force "https://github.com/${REPO}.git" "refs/tags/${major}"

          echo "moved $major -> $target_sha (from $REF_NAME)"

  publish-npm:
    needs: release-draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          npm --version

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Check if version already on registry
        id: check
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "::notice::${pkg_name}@${pkg_version} is already published; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public --ignore-scripts

  sync-marketplace:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: chiz0me/claude-plugins
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          path: marketplace
          persist-credentials: false

      - name: Bump actions-warden version in marketplace.json
        id: update
        working-directory: marketplace
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = '.claude-plugin/marketplace.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const target = data.plugins.find(p => p.name === 'actions-warden');
          if (!target) { console.error('actions-warden not listed in marketplace'); process.exit(1); }
          const desired = process.env.REF_NAME.replace(/^v/, '');
          if (target.version === desired) {
            console.log(`marketplace already at ${desired}; no-op`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
            process.exit(0);
          }
          target.version = desired;
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log(`bumped actions-warden to ${desired}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
          NODE

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        working-directory: marketplace
        env:
          TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "sync: bump actions-warden to ${REF_NAME}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push "https://github.com/chiz0me/claude-plugins.git" HEAD:main
