name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run verify-version-sync
      - run: npm run verify-deps
      - run: npm run check:yaml
      - run: npm run check:docs
      - name: Verify npm package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run check:package
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Verify bundled GitHub Action
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run check:action-bundle
      - name: Smoke-test local GitHub Action
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: ./
        with:
          command: audit
          workflow: test/fixtures/clean.yml
          annotations: 'false'
      - name: dogfood
        run: node src/cli.js audit -w test/fixtures/clean.yml

  warden-self:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - run: npm ci
      - name: audit own workflows
        run: node src/cli.js audit --severity=high
