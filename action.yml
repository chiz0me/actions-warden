name: 'actions-warden'
description: 'Audit GitHub Actions across repositories and organizations; pin, verify, and upgrade dependencies.'
author: 'actions-warden contributors'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  command:
    description: 'Subcommand to run: audit | pin | upgrade | verify | report | org-scan | rules'
    required: false
    default: 'audit'
  workflow:
    description: 'Path or glob (one per line or JSON array). Defaults to workflows and all composite action metadata.'
    required: false
    default: ''
  severity:
    description: 'Minimum severity to report (audit/report/org-scan): low | medium | high | critical'
    required: false
    default: ''
  format:
    description: 'Output format: auto | toon | json | text | csv | sarif | html. Auto uses JSON for org-scan and TOON otherwise.'
    required: false
    default: 'auto'
  mode:
    description: 'Upgrade scope (upgrade/report): major | minor | patch'
    required: false
    default: 'minor'
  min-age:
    description: 'Cooldown in days before accepting a new tag (upgrade/report). Default 7.'
    required: false
    default: '7'
  write:
    description: 'For pin/upgrade: apply changes (true) instead of dry-run (false).'
    required: false
    default: 'false'
  explain:
    description: 'For audit/report/org-scan: include plain-English remediation hint per finding.'
    required: false
    default: 'false'
  offline:
    description: 'For report: skip network calls (audit only).'
    required: false
    default: 'false'
  output-path:
    description: 'Save output to this file. Org-scan generates a scope-specific path when omitted; CSV/HTML require it for other commands.'
    required: false
    default: ''
  token:
    description: 'GitHub API token. Pass github.token from the calling workflow.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to scan. Defaults to GITHUB_WORKSPACE.'
    required: false
    default: ''
  node-version:
    description: 'Deprecated compatibility input; bundled action runtime is managed by GitHub.'
    required: false
    default: ''
  fix:
    description: 'Apply only the planned pin/upgrade change with this exact ID.'
    required: false
    default: ''
  fail-on-findings:
    description: 'For audit/report/org-scan: exit non-zero for findings. Operational errors always fail.'
    required: false
    default: 'true'
  annotations:
    description: 'Create native GitHub file annotations for findings and errors.'
    required: false
    default: 'true'
  config:
    description: 'Repository policy file. Defaults to .actions-warden.yml when present.'
    required: false
    default: ''
  ignore-config:
    description: 'Ignore repository policy and use built-in defaults.'
    required: false
    default: 'false'
  baseline:
    description: 'Baseline file containing accepted finding IDs for audit/report/org-scan.'
    required: false
    default: ''
  organization:
    description: 'GitHub organization login to scan with command: org-scan.'
    required: false
    default: ''
  repository:
    description: 'Repository name/glob for org-scan (one per line or JSON array).'
    required: false
    default: ''
  visibility:
    description: 'Repository visibility for org-scan: all | public | private | internal.'
    required: false
    default: 'all'
  include-archived:
    description: 'For org-scan: include archived repositories.'
    required: false
    default: 'false'
  include-disabled:
    description: 'For org-scan: include disabled repositories.'
    required: false
    default: 'false'
  include-forks:
    description: 'For org-scan: include forked repositories.'
    required: false
    default: 'false'
  max-repos:
    description: 'For org-scan: optional maximum number of repositories.'
    required: false
    default: ''
  concurrency:
    description: 'For org-scan: concurrent repository scans (1-16).'
    required: false
    default: '4'
  checkpoint-path:
    description: 'For org-scan: create or automatically resume a compatible checkpoint inside the working directory.'
    required: false
    default: ''
  resume-from:
    description: 'For org-scan: resume from and update an existing checkpoint inside the working directory.'
    required: false
    default: ''
  fresh:
    description: 'For org-scan: ignore reusable results and replace the selected checkpoint.'
    required: false
    default: 'false'
  auto-checkpoint:
    description: 'For org-scan: create or resume a scope-specific checkpoint when no checkpoint path is supplied.'
    required: false
    default: 'true'
  previous-report:
    description: 'For org-scan: compare against a previous actions-warden organization JSON report.'
    required: false
    default: ''
  progress:
    description: 'For org-scan: show live repository progress and retry waits in the step log.'
    required: false
    default: 'true'

outputs:
  status:
    description: 'OK or FAIL'
  findings:
    description: 'Unsuppressed finding count after severity filtering (audit/report/org-scan; otherwise 0).'
  total-findings:
    description: 'Finding count before baseline suppression and after severity filtering (audit/report/org-scan; otherwise 0).'
  critical:
    description: 'Unsuppressed critical finding count (audit/report/org-scan; otherwise 0).'
  high:
    description: 'Unsuppressed high finding count (audit/report/org-scan; otherwise 0).'
  medium:
    description: 'Unsuppressed medium finding count (audit/report/org-scan; otherwise 0).'
  low:
    description: 'Unsuppressed low finding count (audit/report/org-scan; otherwise 0).'
  suppressed:
    description: 'Finding count suppressed by the active baseline (audit/report/org-scan; otherwise 0).'
  errors:
    description: 'Operational error count, including workflow parse failures.'
  repositories-discovered:
    description: 'Repositories visible during org-scan discovery (otherwise 0).'
  repositories-selected:
    description: 'Repositories selected by org-scan scope and limits (otherwise 0).'
  repositories-scanned:
    description: 'Repositories completed by org-scan (otherwise 0).'
  repositories-resumed:
    description: 'Repositories reused from a verified org-scan checkpoint (otherwise 0).'
  repositories-failed:
    description: 'Repositories with organization access or coverage errors (otherwise 0).'
  coverage-complete:
    description: 'true when org-scan covered every eligible repository in the requested scope without limits or operational gaps; empty for other commands.'
  new-findings:
    description: 'Findings added since previous-report during org-scan comparison (otherwise 0).'
  resolved-findings:
    description: 'Findings safely resolved since previous-report during org-scan comparison (otherwise 0).'
  unchanged-findings:
    description: 'Findings unchanged since previous-report during org-scan comparison (otherwise 0).'
  unknown-findings:
    description: 'Previous findings whose resolution is unknown because current coverage was incomplete (otherwise 0).'
  report-path:
    description: 'Absolute path of the written report file. Org-scan always writes a report.'
  checkpoint-path:
    description: 'Absolute path of the active org-scan checkpoint, or empty when automatic checkpointing was disabled.'
  annotations:
    description: 'Number of native GitHub annotations emitted.'
  annotations-skipped:
    description: 'Number of annotations omitted because of per-level limits.'

runs:
  using: 'node24'
  main: 'dist/index.js'
