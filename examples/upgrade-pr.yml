name: actions-warden upgrades

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions-warden-ref: v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions-warden-ref: v5.0.0
        with:
          node-version: '24'

      - name: Apply eligible upgrades
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes actions-warden@0.2.0 upgrade --mode=minor --min-age=7 --write

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPGRADE_BRANCH: actions-warden/weekly-upgrades
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No eligible upgrades."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: upgrade pinned GitHub Actions"
          remote_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${UPGRADE_BRANCH}" --jq .object.sha 2>/dev/null || true)"
          lease="--force-with-lease=refs/heads/${UPGRADE_BRANCH}:${remote_sha}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "$lease" "https://github.com/${REPOSITORY}.git" "HEAD:refs/heads/${UPGRADE_BRANCH}"

          if ! gh pr view "$UPGRADE_BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --head "$UPGRADE_BRANCH" \
              --title "chore: upgrade pinned GitHub Actions" \
              --body "Automated, cooldown-aware upgrade generated by actions-warden."
          fi
