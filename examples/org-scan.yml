name: actions-warden organization report

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions-warden-ref: v5.0.0
        with:
          persist-credentials: false

      - name: Scan organization workflows
        id: warden
        uses: chiz0me/actions-warden@<FULL_COMMIT_SHA>
        with:
          command: org-scan
          organization: ${{ github.repository_owner }}
          token: ${{ secrets.ACTIONS_WARDEN_ORG_TOKEN }}
          severity: high
          explain: 'true'
          fail-on-findings: 'false'

      - name: Show organization coverage
        if: always()
        shell: bash
        env:
          WARDEN_STATUS: ${{ steps.warden.outputs.status }}
          WARDEN_DISCOVERED: ${{ steps.warden.outputs['repositories-discovered'] }}
          WARDEN_SELECTED: ${{ steps.warden.outputs['repositories-selected'] }}
          WARDEN_SCANNED: ${{ steps.warden.outputs['repositories-scanned'] }}
          WARDEN_RESUMED: ${{ steps.warden.outputs['repositories-resumed'] }}
          WARDEN_FAILED: ${{ steps.warden.outputs['repositories-failed'] }}
          WARDEN_COVERAGE_COMPLETE: ${{ steps.warden.outputs['coverage-complete'] }}
          WARDEN_FINDINGS: ${{ steps.warden.outputs.findings }}
          WARDEN_ERRORS: ${{ steps.warden.outputs.errors }}
        run: |
          printf 'status=%s coverage_complete=%s discovered=%s selected=%s scanned=%s resumed=%s failed=%s findings=%s errors=%s\n' \
            "$WARDEN_STATUS" "$WARDEN_COVERAGE_COMPLETE" \
            "$WARDEN_DISCOVERED" "$WARDEN_SELECTED" \
            "$WARDEN_SCANNED" "$WARDEN_RESUMED" "$WARDEN_FAILED" \
            "$WARDEN_FINDINGS" "$WARDEN_ERRORS"

      - name: Upload organization report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions-warden-ref: v5.0.0
        with:
          name: actions-warden-org-report
          path: |
            ${{ steps.warden.outputs['report-path'] }}
            ${{ steps.warden.outputs['checkpoint-path'] }}
          include-hidden-files: true
          if-no-files-found: error
